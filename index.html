<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="formulario">
        <input type="text" id="nombre" placeholder="Escribe tu nombre">
        <button onclick="cambiarTitulo()">Enviar</button>
    </div>
    
    <h1 id="titulo"></h1>
    <div>   
        <img 
            src="freddy.png" 
            alt="Fue p" 
            id="imgfreddy"
            style="width:200px; cursor:pointer; display: none;"
        >
        <p id="chiste"></p>
    </div> 
    <audio id="audiorisa">
        <source src="risa-aquino.mp3" type="audio/mpeg">
    </audio>

    <audio id="audiokira">
        <source src="kira.mp3" type="audio/mpeg">
    </audio>

    <audio id="audioL">
        <source src="L.mp3" type="audio/mpeg">
    </audio>

    <audio id="audiofreddy">
        <source src="freddy.mp3" type="audio/mpeg">
    </audio>

    <script>
        let temporizador;

        function detenerAudios(tiempoMs = 0) {
            clearTimeout(temporizador);

            temporizador = setTimeout(() => {
                document.querySelectorAll("audio").forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
                });
            }, tiempoMs);
        }

        document.title = "Hola"; 
        nombre=document.getElementById("nombre").value;
        function cambiarTitulo() {
            const imgfreddy = document.getElementById("imgfreddy");
            const audiofreddy = document.getElementById("audiofreddy");
            imgfreddy.style.display="block"
            const chiste = document.getElementById("chiste");
            imgfreddy.onclick = function() {
                audiofreddy.currentTime = 0;
                audiofreddy.play();
                if(nombre=="renato" || nombre=="Renato"){
                    title=document.getElementById("titulo")
                    title.textContent="Eso haria kira";
                    detenerAudios(1000);
                }
                else {
                    detenerAudios();
                }
                fetch("https://v2.jokeapi.dev/joke/Any?lang=es&blacklistFlags=nsfw")
                    .then(response => response.json())
                    .then(data => {
                        if (data.type === "single") {
                            chiste.textContent = data.joke;
                        } else {
                            chiste.textContent =
                                data.setup + " — " + data.delivery;
                        }
                    })
                    .catch(error => {
                        chiste.textContent = "Error al obtener el chiste 😢";
                        console.error(error);
                    });
            };
            const nombre = document.getElementById("nombre").value;
            const titulo = document.getElementById("titulo");
            if(nombre=="renato" || nombre=="Renato"){
                document.title="gaaaa"
                title=document.getElementById("titulo")
                title.style.color="red"
                title.textContent="tu ere kira"
                const audiokira = document.getElementById("audiokira");
                audiokira.currentTime = 0;
                audiokira.play();
            }else if(nombre=="rodrigo" || nombre=="Rodrigo"){
                document.title="Hola"
                title=document.getElementById("titulo")
                title.textContent="Hola R"
                const audioL = document.getElementById("audioL");
                audioL.currentTime = 0;
                audioL.play();
            }else if(nombre=="victor" || nombre=="Victor"){
                document.title="chupalo victor"
                title=document.getElementById("titulo")
                title.style.color="red"
                title.textContent="Fuera sapo"
                const audiorisa = document.getElementById("audiorisa");    
                audiorisa.currentTime = 0;
                audiorisa.play(); 
            }else{
                document.title="bienvenido "+nombre
                titulo.textContent = "Hola " + nombre;
            }
            formulario.style.display="none"
        }
    </script>
</body>
</html>
